# SMART implementation frameworks from the ICSBE 2025 paper (Tables 8-11). Source: Author.
- table: 8
  driver: regulations
  rows:
    Specific: Mandate climate risk disclosure rules for all licensed banks, with annual reporting of financed emissions (Scope 3) and public disclosure of green asset ratios (GAR) by Q2 2028.
    Measurable: 100% compliance with disclosure rules by Q2 2028; 40% of bank portfolios allocated to green/social financing loans by Q3 2029; penalties for non-compliance (e.g. 1.5% of revenue for missed targets).
    Achievable: Central bank adoption of ECB-linked climate stress tests; SEC alignment with regional ESG disclosure standards (e.g. ASEAN); technical assistance from the IMF's Climate Finance Task Force.
    Relevant: Linked to IPCC 1.5°C pathways (e.g. 40% emissions cuts in transport/buildings by 2030).
    Time-bound: "Phase 1 (Q4 2026), draft regulations finalised. Phase 2 (Q4 2027), pilot with systemically important banks. Phase 3 (Q4 2028), full enforcement."
- table: 9
  driver: market mechanisms
  rows:
    Specific: Establish a Green Finance Task Force at emerging-economy stock exchanges to implement the UN SSE Carbon Market Framework and require every bank to list a green financial product by 2030.
    Measurable: 10+ certified green bonds listed by Q2 2028; pilot carbon credit trading platform launched by Q3 2028 with national government.
    Achievable: Leverage partnerships with the SEC, Ministry of Environment, MDBs and national government through MOUs.
    Relevant: Aligned with updated NDCs, 2050 Net Zero roadmaps, and UN SDGs 7, 12 and 13.
    Time-bound: "Phase 1 (Q4 2027), updated regulatory framework. Phase 2 (Q1 2028), market readiness assessment. Phase 3 (Q2 2029), full implementation."
- table: 10
  driver: market awareness
  rows:
    Specific: Formalise co-regional technology transfer mechanisms between emerging and developed economies (e.g. Colombo Stock Exchange and Singapore Stock Exchange) via working groups on green bond listings and carbon market integration.
    Measurable: Adoption of 3 developed-economy-aligned ESG policies within the first 12 months.
    Achievable: Leverage UN SSE partnerships with global exchanges for funding and technical support.
    Relevant: Aligned with the domestic national climate strategy (2023-2030) and updated NDC targets.
    Time-bound: "Phase 1 (Q3 2026), policy drafting. Phase 2 (Q1 2027), launch. Phase 3 (Q1 2028), regional expansion."
- table: 11
  driver: incentives
  rows:
    Specific: Targeted incentives for energy, low-carbon buildings, transport, and land use (rainforest conservation, soil enrichment), with 20% of bank portfolios directed to these sectors by 2028.
    Measurable: 30% of listed entities adopting IPCC 1.5°C-aligned transition plans by 2027.
    Achievable: Collaboration between the Securities Exchange Commission and Departments of Inland Revenue on tax breaks for green bonds.
    Relevant: Aligned with UNFCCC Article 6 carbon trading and the 2030 Agenda for Sustainable Development.
    Time-bound: "Phase 1 (Q1 2028), pilot tax breaks. Phase 2 (Q1 2029), expand green bond issuance to 35% of listed bond issuances."
