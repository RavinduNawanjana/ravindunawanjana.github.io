# Public repositories shown on the Code page. "tools" drives the tool matrix figure,
# so use the same spelling each time: R, Python, Quarto, Jupyter, Stata, SPSS, GitHub Actions.
- name: Multilateral climate finance architecture
  repo: multilateral-climate-finance-architecture
  group: degree
  label: MSc research
  focus: >-
    Reproduces the MSc survey analysis from the anonymised responses, covering reliability, correlations,
    OLS with standardised slopes, diagnostics and leave-one-respondent-out sensitivity, with
    automated checks against the SPSS-reported values. Includes a written specification of the
    Institutional Reinforcement Cycle.
  tools: [R, Quarto, GitHub Actions]
- name: Stock exchanges and bank green finance adoption
  repo: stock-exchange-intermediation-green-finance
  group: degree
  label: BSc research
  focus: >-
    R-first analysis of the Figshare survey package, covering scoring, reliability, correlations, OLS
    with VIF and influence diagnostics, bootstrap, KMO/Bartlett and exploratory factor analysis,
    chi-square sensitivity and direct reconciliation with the SPSS file. Python/Jupyter runs as
    an independent audit of the same data.
  tools: [R, Quarto, Python, Jupyter, SPSS, GitHub Actions]
- name: Sri Lanka rice IALM feasibility
  repo: sri-lanka-rice-ialm-feasibility
  group: computational
  focus: >-
    Reconstructs a 2025 paddy-field feasibility study of alternate wetting and drying, reduced
    tillage and nutrient management (32 plot records, 2 x 2 x 4 x 2 design), and maps the
    evidence needed for methane and carbon-credit quantification under VM0042 and VM0051.
  tools: [R, Python, Stata, Jupyter]
  image: assets/img/rice-field-chambers.jpg
  image_alt: Rice plots with greenhouse-gas monitoring chambers installed in the field, Sri Lanka, August 2025.
- name: Carbon project methodology due diligence
  repo: carbon-project-methodology-due-diligence
  group: computational
  focus: >-
    Evidence review for carbon methodologies with explicit assumptions, deterministic
    sensitivity analysis and seeded Monte Carlo simulation of scenario risk.
  tools: [Python, Jupyter, Quarto]
- name: Sri Lanka waste-to-energy carbon-project design
  repo: sri-lanka-waste-to-energy-carbon-project-design
  group: computational
  focus: >-
    Municipal feedstock mass balance, technology screening and avoided-emissions sensitivity for
    a waste-to-energy project designed around ACM0022.
  tools: [Python, Jupyter, Quarto]
- name: Sri Lanka coconut ARR feasibility model audit
  repo: sri-lanka-coconut-arr-feasibility-model-audit
  group: computational
  focus: >-
    Cohort accounting, mortality, carbon stock change and cash-flow sensitivity for a hybrid
    coconut afforestation project screened against VM0047, with robustness checks in R.
  tools: [Python, R, Quarto]
- name: Commonwealth Games net-zero roadmap
  repo: commonwealth-games-net-zero-roadmap
  group: computational
  focus: >-
    Independent GHG inventory framework for Glasgow 2026, covering activity boundaries, non-overlapping
    abatement measures and uncertainty.
  tools: [Python, Quarto]
- name: Sri Lanka youth energy-transition governance
  repo: sri-lanka-youth-energy-transition-governance
  group: computational
  focus: >-
    Programme monitoring in R for the Commonwealth Sustainable Energy Transition Youth chapter
    in Sri Lanka, linking each activity to its evidence and completion record.
  tools: [R, Quarto]
- name: Germany organic fertiliser market entry
  repo: germany-organic-fertiliser-market-entry
  group: computational
  focus: >-
    EU fertiliser regulation route screening (FPR product function and component categories),
    unit economics and landed-cost sensitivity.
  tools: [Python, Quarto]
