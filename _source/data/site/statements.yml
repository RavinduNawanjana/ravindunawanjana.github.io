# Research statements. Each needs a page at the given href.
- title: Climate finance as a dynamic system
  href: research/statements/dynamic-systems.qmd
  reference: Professor Eli Fenichel
  summary: >-
    Treats capital flows and natural asset stocks as interacting dynamic systems, and asks
    whether Small Island Developing States face the same borrowing problem as undiversified,
    insurance-poor US municipalities.
- title: Cost of capital, energy adoption and integrated assessment
  href: research/statements/energy-and-integrated-assessment.qmd
  reference: Professor Kenneth Gillingham
  summary: >-
    Proposes estimating the cost of capital in developing economies as an outcome of
    institutional quality, adding it to a structural IAM, and testing how far cheaper capital
    closes the clean energy adoption gap.
- title: Fund design, pilots and political economy
  href: research/statements/fund-design.qmd
  reference: Professor Matthew Kotchen
  summary: >-
    Asks what multilateral climate funds should target when institutional collaboration is the
    scarce input, and whether concessional capital is better priced as an option on a later
    full-scale project.
