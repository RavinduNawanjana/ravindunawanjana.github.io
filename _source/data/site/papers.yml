- id: mcf
  short: Multilateral climate funds
  title: "The Role of Multilateral Climate Funds in Shaping the Architecture of Climate Finance: An Analysis of Blended Finance and Institutional Collaboration among MDBs, Central Banks, and Private Capital across the G77 and China"
  page: research/multilateral-climate-funds.qmd
  badge: MSc dissertation
  venue: "*Proceedings of the 3rd International Conference on Biomimicry for Sustainability (ICBS 2026)*, ISSN 3093-6020."
  journal: "Journal version, \"Practitioner perspectives on institutional collaboration and multilateral climate funds in the Group of 77 and China\", under revision at *Climate and Development*."
  home_status: ICBS 2026 · Journal version under revision
  home_desc: Survey and interview evidence from the G77 and China, and the Institutional Reinforcement Cycle.
  summary: >-
    Multilateral climate funds are expected to move capital at scale into the G77 and China,
    yet a large climate finance gap persists. Combining a survey of 103 sustainable finance
    specialists with eight interviews with practitioners at MDBs, climate funds, UN bodies, a
    central bank and a private capital firm, I find that institutional collaboration is the only
    factor with a significant, independent association with the effectiveness of the funds'
    architecture. Interviewees saw blended finance as the main route to private capital, but
    described it as held back by fragmented governance, silos between vertical funds and MDBs,
    and regulatory dissonance. The paper develops the Institutional Reinforcement Cycle to
    explain why these determinants act as complements.
  figure: assets/img/irc-cycle.jpg
  figure_alt: "Diagram of the Institutional Reinforcement Cycle: institutional collaboration, policy and regulatory alignment, transparency and accountability, and effectiveness of blended finance in a loop, with climate shocks acting on the cycle and overall climate finance effectiveness as the outcome."
  figure_caption: The Institutional Reinforcement Cycle.
