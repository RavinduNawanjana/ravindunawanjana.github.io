- id: sx
  short: Stock exchanges and green finance
  title: "The Role of Stock Exchanges in Promoting the Banking Sector in Adopting Green Finance: A Global Analysis with Insights from Emerging Markets"
  page: research/stock-exchanges-green-finance.qmd
  badge: BSc dissertation
  venue: "*Proceedings of the 16th International Conference on Sustainable Built Environment (ICSBE 2025)*, vol. 2, pp. 1622-1643, December 2025. ISSN 3051-5874."
  journal: "Journal version under revision at *Climate and Development*."
  home_status: ICSBE 2025 · Journal version under revision
  home_desc: Four drivers of green finance adoption by banks, with SMART policy frameworks for emerging-market exchanges.
  summary: >-
    How can stock exchanges get banks to adopt green finance? Drawing on 64 sources and survey
    data from financial practitioners in emerging markets including India, Malaysia, Ghana and
    Sri Lanka, the paper identifies four interdependent drivers of adoption, namely market regulations,
    market mechanisms, awareness and incentives. IMF/IOSCO data show that only 49% of regulators
    in low-income economies maintain supportive market regulations, against 85% in high-income
    OECD countries. The paper argues that exchanges should move from voluntary guidance to
    binding rules on ESG disclosure and green bond standards for listed banks, and sets out
    SMART implementation frameworks for each driver.
