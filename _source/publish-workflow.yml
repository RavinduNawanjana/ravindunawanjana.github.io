# OPTIONAL: automatic rebuilds on GitHub.
# To use it, create the file .github/workflows/publish.yml in the repository
# (Add file > Create new file, type that path as the name), paste this whole file,
# commit, then set Settings > Pages > Build and deployment > Source: "GitHub Actions".
# After that, every push re-runs the R code in _source/ and publishes the result.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _source
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: _source
          packages: |
            any::knitr
            any::rmarkdown
            any::ggplot2
            any::yaml
            any::htmltools
            any::jsonlite
            any::reticulate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install numpy

      - name: Render site
        env:
          RETICULATE_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _source/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
