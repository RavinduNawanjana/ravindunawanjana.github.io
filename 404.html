<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found | Ravindu Nawanjana</title>
<style>
  :root { --bg: #ffffff; --ink: #17201a; --muted: #56605a; --link: #0b3d8f; --leaf: #2f6d4f; --rule: #d9ddd5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12160f; --ink: #e7ebe2; --muted: #a7b0a1; --link: #8db6ee; --leaf: #5fb383; --rule: #2c332a; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.65 Georgia, "Times New Roman", serif; }
  header { border-bottom: 1px solid var(--rule); padding: 1rem 1.5rem; }
  header a { font-size: 1.4rem; font-weight: 800; color: var(--link); text-underline-offset: 4px; }
  main { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  h1 { font-size: 1.8rem; margin: 0 0 0.6rem; }
  p { color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 1.5rem 0; }
  li { padding: 0.45rem 0; border-bottom: 1px dotted var(--rule); }
  li a { color: var(--link); text-decoration: none; font-weight: 600; }
  li a:hover { text-decoration: underline; }
  li span { color: var(--leaf); margin-right: 0.5rem; }
</style>
</head>
<body>
<header><a data-path="" href="/">Ravindu Nawanjana - Environmental Economist</a></header>
<main>
  <h1>Page not found</h1>
  <p>The page you were looking for isn't here. It may have moved when the site was rebuilt.</p>
  <ul>
    <li><span>&rarr;</span><a data-path="" href="/">Home</a></li>
    <li><span>&rarr;</span><a data-path="research.html" href="/research.html">Research</a></li>
    <li><span>&rarr;</span><a data-path="research.html#statements" href="/research.html#statements">Research statements</a></li>
    <li><span>&rarr;</span><a data-path="code.html" href="/code.html">Code and data</a></li>
    <li><span>&rarr;</span><a data-path="media.html" href="/media.html">Media</a></li>
  </ul>
</main>
<script>
  // Works whether the site lives at the domain root or in a project folder (e.g. /Website/).
  (async function () {
    var segs = location.pathname.split("/").filter(Boolean);
    var base = "/";
    if (segs.length) {
      var cand = "/" + segs[0] + "/";
      try {
        var r = await fetch(cand + "site_libs/quarto-html/quarto.js", { method: "HEAD" });
        if (r.ok) base = cand;
      } catch (e) {}
    }
    document.querySelectorAll("a[data-path]").forEach(function (a) { a.href = base + a.getAttribute("data-path"); });
  })();
</script>
</body>
</html>
